name: Set up Android toolchain
description: Validates the Gradle wrapper, then installs JDK 21, the pinned Android SDK command-line tools with platform/build-tools 37, and Gradle caching.

runs:
  using: composite
  steps:
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v6

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 15859902
        # v3 defaults to "tools platform-tools"; the obsolete "tools" package is
        # no longer available and makes sdkmanager exit 1 on current runners.
        packages: platform-tools

    - name: Select current Android SDK CLI
      shell: bash
      run: |
        mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/android-cmdline-tools-previous"
        ln -s "$ANDROID_HOME/cmdline-tools/15859902" "$ANDROID_HOME/cmdline-tools/latest"
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

    - name: Install Android SDK 37.0
      shell: bash
      run: sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
